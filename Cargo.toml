[package]
name = "dragonfly-client-opengrep"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
figment = {version = "0.10.19", features = ["env", "toml"]}
flate2 = "1.1.5"
reqwest = {version = "0.13.1", features = ["blocking", "gzip", "json", "query"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.24.0"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", features = ["env-filter"]}
walkdir = "2.5.0"
zip = {version = "7.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"]}

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
